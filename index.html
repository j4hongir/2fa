<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --border: #1e1e1e;
  --text-primary: #f0f0f0;
  --text-secondary: #4a4a4a;
  --text-muted: #2a2a2a;
  --danger: #ff453a;
  --success: #30d158;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'IBM Plex Mono', monospace;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  width: 320px;
  display: flex;
  flex-direction: column;
}

#header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0 0 20px;
  border-bottom: 1px solid var(--border);
}

#title {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-primary);
  letter-spacing: 2px;
}

#source-link {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 0.2s;
}

#source-link:hover { color: var(--text-secondary); }

#clock-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
}

#clock {
  font-size: 22px;
  font-weight: 300;
  color: var(--text-primary);
  letter-spacing: 2px;
}

#date {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

#input-row {
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

#key {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  outline: none;
  caret-color: var(--text-primary);
  transition: color 0.2s;
  min-width: 0;
}

#key:focus { color: var(--text-primary); }
#key::placeholder { color: var(--text-muted); }

#toggle-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  flex-shrink: 0;
  transition: color 0.2s;
  line-height: 1;
}

#toggle-btn:hover { color: var(--text-secondary); }

#code-row {
  padding: 28px 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  user-select: none;
}

#code-row:active { opacity: 0.7; }

#code {
  font-size: 48px;
  font-weight: 300;
  letter-spacing: 6px;
  line-height: 1;
  color: var(--text-primary);
  transition: color 0.3s;
}

#code.state-empty   { color: var(--text-muted); }
#code.state-invalid { color: var(--text-secondary); font-size: 14px; letter-spacing: 3px; padding: 17px 0; }
#code.state-urgent  { color: var(--danger); }
#code.state-copied  { color: var(--success); }

#copy-hint {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: color 0.2s;
  flex-shrink: 0;
}

#code-row:hover #copy-hint { color: var(--text-secondary); }
#copy-hint.copied { color: var(--success); }

#progress-track {
  height: 1px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}

#progress-bar {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  background: var(--text-secondary);
  transition: background 0.3s;
}

#progress-bar.urgent { background: var(--danger); }

#timer-row {
  padding: 16px 0 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#timer {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  transition: color 0.3s;
}

#timer.urgent { color: var(--danger); }

#timer-label {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div id="app">

  <div id="header-row">
    <div id="title">j4hongirs 2fa</div>
    <a id="source-link" href="https://github.com/j4hongirs/2fa" target="_blank" rel="noopener">source</a>
  </div>

  <div id="clock-row">
    <div id="clock">00:00:00</div>
    <div id="date"></div>
  </div>

  <div id="input-row">
    <input id="key" type="password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="secret key">
    <button id="toggle-btn" type="button">show</button>
  </div>

  <div id="code-row" role="button" tabindex="0" aria-label="Copy TOTP code" onclick="copyCode()">
    <div id="code" class="state-empty">— — —</div>
    <div id="copy-hint">copy</div>
  </div>

  <div id="progress-track">
    <div id="progress-bar"></div>
  </div>

  <div id="timer-row">
    <div id="timer">29s</div>
    <div id="timer-label">next code</div>
  </div>

</div>
<script>
const keyInput    = document.getElementById('key');
const codeEl      = document.getElementById('code');
const clockEl     = document.getElementById('clock');
const dateEl      = document.getElementById('date');
const timerEl     = document.getElementById('timer');
const progressBar = document.getElementById('progress-bar');
const copyHint    = document.getElementById('copy-hint');
const toggleBtn   = document.getElementById('toggle-btn');

const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const STATES = ['state-empty','state-invalid','state-urgent','state-copied'];

let currentKey   = '';
let cachedSecret = '';
let cachedKey    = null;
let lastCounter  = -1;
let lastCode     = '';
let copyTimeout  = null;
let isCopied     = false;

function setCodeState(state, text) {
  STATES.forEach(s => codeEl.classList.toggle(s, s === state));
  if (text !== undefined) codeEl.textContent = text;
}

function getCounter() {
  return Math.floor(Date.now() / 1000 / 30);
}

function getSecondsRemaining() {
  return 29 - (Math.floor(Date.now() / 1000) % 30);
}

function getProgress() {
  return ((29 - Math.floor(Date.now() / 1000) % 30) / 29) * 100;
}

function base32ToBytes(base32) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = base32.toUpperCase().replace(/[^A-Z2-7]/g, '');
  if (clean.length === 0) return null;
  const output = [];
  let bits = 0, value = 0;
  for (let i = 0; i < clean.length; i++) {
    const idx = alphabet.indexOf(clean[i]);
    if (idx === -1) continue;
    value = (value << 5) | idx;
    bits += 5;
    if (bits >= 8) {
      output.push((value >>> (bits - 8)) & 0xff);
      bits -= 8;
    }
  }
  return output.length > 0 ? new Uint8Array(output) : null;
}

async function importSecret(secret) {
  const keyBytes = base32ToBytes(secret);
  if (!keyBytes) return null;
  try {
    return await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  } catch (e) {
    return null;
  }
}

async function computeTOTP(cryptoKey, counter) {
  try {
    const counterBytes = new Uint8Array(8);
    let tmp = counter;
    for (let i = 7; i >= 0; i--) { counterBytes[i] = tmp & 0xff; tmp = Math.floor(tmp / 256); }
    const sig  = await crypto.subtle.sign('HMAC', cryptoKey, counterBytes);
    const hmac = new Uint8Array(sig);
    const offset = hmac[hmac.length - 1] & 0x0f;
    const code = (
      ((hmac[offset]     & 0x7f) << 24) |
      ((hmac[offset + 1] & 0xff) << 16) |
      ((hmac[offset + 2] & 0xff) << 8)  |
       (hmac[offset + 3] & 0xff)
    ) % 1000000;
    return code.toString().padStart(6, '0');
  } catch (e) {
    return null;
  }
}

async function refreshSecret() {
  if (currentKey === cachedSecret) return;
  cachedSecret = currentKey;
  cachedKey    = null;
  lastCounter  = -1;
  lastCode     = '';
  if (!currentKey) return;
  cachedKey = await importSecret(currentKey);
}

async function refreshCode() {
  await refreshSecret();

  if (!currentKey) {
    setCodeState('state-empty', '— — —');
    lastCode = '';
    return;
  }

  if (!cachedKey) {
    setCodeState('state-invalid', 'invalid key');
    lastCode = '';
    return;
  }

  const counter = getCounter();
  if (counter === lastCounter) return;
  lastCounter = counter;

  const result = await computeTOTP(cachedKey, counter);
  if (result) {
    lastCode = result.slice(0, 3) + ' ' + result.slice(3);
  } else {
    lastCode = '';
    setCodeState('state-invalid', 'invalid key');
  }
}

async function copyCode() {
  if (!lastCode) return;
  const raw = lastCode.replace(/\s/g, '');
  let ok = false;
  try { await navigator.clipboard.writeText(raw); ok = true; } catch (e) {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = raw;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}
  }
  if (!ok) return;
  isCopied = true;
  setCodeState('state-copied', lastCode);
  copyHint.classList.add('copied');
  copyHint.textContent = 'copied';
  clearTimeout(copyTimeout);
  copyTimeout = setTimeout(() => {
    isCopied = false;
    copyHint.classList.remove('copied');
    copyHint.textContent = 'copy';
    renderCode();
  }, 1500);
}

document.getElementById('code-row').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyCode(); }
});

toggleBtn.addEventListener('click', () => {
  const isHidden = keyInput.type === 'password';
  keyInput.type = isHidden ? 'text' : 'password';
  toggleBtn.textContent = isHidden ? 'hide' : 'show';
});

keyInput.addEventListener('input', async () => {
  currentKey = keyInput.value.replace(/\s+/g, '').toUpperCase();
  keyInput.value = currentKey;
  await refreshCode();
  if (!isCopied) renderCode();
});

function renderCode() {
  if (isCopied) return;
  if (!lastCode) return;
  const urgent = getSecondsRemaining() <= 5;
  setCodeState(urgent ? 'state-urgent' : '', lastCode);
}

function updateClock() {
  const now = new Date();
  clockEl.textContent =
    now.getHours().toString().padStart(2, '0') + ':' +
    now.getMinutes().toString().padStart(2, '0') + ':' +
    now.getSeconds().toString().padStart(2, '0');
  dateEl.textContent = DAYS[now.getDay()] + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()];
}

async function tick() {
  updateClock();

  const seconds = getSecondsRemaining();
  const urgent  = seconds <= 5;

  timerEl.textContent = seconds + 's';
  timerEl.classList.toggle('urgent', urgent);
  progressBar.style.width = getProgress() + '%';
  progressBar.classList.toggle('urgent', urgent);

  await refreshCode();
  renderCode();

  setTimeout(tick, 1000 - (Date.now() % 1000));
}

tick();
</script>
</body>
</html>
